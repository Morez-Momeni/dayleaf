<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro — Dayleaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #718F78; --green-dark: #4E6C56; --green-light: #EDF4ED;
      --bg: #F6F7F4; --white: #FFFFFF; --text: #26342C; --muted: #89938A;
      --border: #E9EDE7; --muted-bg: #F2F4F0;
      --amber: #D9A441; --rose: #C9758B;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(38,52,44,.04), 0 4px 14px rgba(38,52,44,.04);
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --green: #8FB197; --green-dark: #A7C7AE; --green-light: #24322A;
      --bg: #171B18; --white: #1F2521; --text: #E7ECE7; --muted: #98A29A;
      --border: #2C332D; --muted-bg: #242A25;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; }
    select, input { font-family: inherit; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 24px 48px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--green-light); color: var(--green-dark); display: grid; place-items: center; }
    .brand-name { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
    .topbar-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .btn { border: 1px solid transparent; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s ease; white-space: nowrap; text-decoration: none; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-ghost { background: var(--white); border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--muted-bg); }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    .page-header { text-align: center; margin-bottom: 22px; }
    .page-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .page-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }

    .mode-switch { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--muted-bg); margin: 0 auto 20px; }
    .mode-btn { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; transition: background .15s ease, color .15s ease; }
    .mode-btn:hover { color: var(--text); }
    .mode-btn.active { background: var(--white); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    [data-theme="dark"] .mode-btn.active { background: var(--green-light); color: var(--green-dark); }

    .timer-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
    .timer-svg { width: 300px; height: 300px; transform: rotate(-90deg); }
    .timer-track { fill: none; stroke: var(--muted-bg); stroke-width: 12; }
    .timer-progress { fill: none; stroke: var(--green); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
    .timer-text { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .timer-time { font-size: 56px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .timer-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 4px; }
    .timer-relative { position: relative; width: 300px; height: 300px; }

    .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .controls .btn { padding: 12px 24px; font-size: 15px; }
    .controls .btn-primary { padding: 12px 32px; }

    .durations { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-row label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .form-row select { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 15px; background: var(--muted-bg); color: var(--text); }
    .form-row select:focus { outline: none; border-color: var(--green); background: var(--white); }

    .task-picker { margin-bottom: 8px; }
    .task-picker select { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; background: var(--muted-bg); color: var(--text); }
    .task-picker select:focus { outline: none; border-color: var(--green); background: var(--white); }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .stat-box { background: var(--white); padding: 16px 12px; text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-top: 2px; }

    .session-list { display: flex; flex-direction: column; gap: 6px; }
    .session-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
    .session-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .session-row .session-time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
    .session-row .session-dur { font-weight: 600; }
    .session-row .session-task { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }

    .empty { text-align: center; padding: 20px; color: var(--muted); font-size: 14px; }

    .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: calc(100vw - 40px); }
    .toast { background: var(--text); color: var(--white); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.2); animation: slideIn .2s ease; }
    .toast.error { background: #a33; }
    .toast.success { background: var(--green-dark); }
    @keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

    @media (max-width: 600px) {
      .wrap { padding: 16px 14px 32px; }
      .page-title { font-size: 22px; }
      .timer-svg, .timer-relative { width: 240px; height: 240px; }
      .timer-time { font-size: 44px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .durations { grid-template-columns: 1fr; }
      .toast-container { right: 10px; left: 10px; bottom: 10px; max-width: none; }
      .toast { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="/" class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3C8 6 6 9 6 13a6 6 0 0 0 12 0c0-4-2-7-6-10z"/>
            <path d="M12 8v9"/>
          </svg>
        </div>
        <span class="brand-name">Dayleaf</span>
      </a>
      <div class="topbar-actions">
        <a href="/" class="btn btn-ghost">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Planner
        </a>
        <button class="btn btn-ghost theme-toggle" id="theme-toggle" type="button" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="page-header">
      <h1 class="page-title">Pomodoro</h1>
      <p class="page-subtitle">Focus for 25 minutes. Then rest.</p>
    </div>

    <div style="text-align:center;">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="focus" type="button">Focus</button>
        <button class="mode-btn" data-mode="break" type="button">Break</button>
      </div>
    </div>

    <div class="timer-wrap">
      <div class="timer-relative">
        <svg class="timer-svg" viewBox="0 0 300 300">
          <circle class="timer-track" cx="150" cy="150" r="140"></circle>
          <circle class="timer-progress" id="timer-progress" cx="150" cy="150" r="140" stroke-dasharray="879.6" stroke-dashoffset="0"></circle>
        </svg>
        <div class="timer-text">
          <div class="timer-time" id="timer-time">25:00</div>
          <div class="timer-label" id="timer-label">Focus</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-ghost" id="reset-btn" type="button" title="Reset">Reset</button>
      <button class="btn btn-primary" id="start-btn" type="button">Start</button>
    </div>

    <div class="card">
      <div class="durations">
        <div class="form-row">
          <label for="focus-min">Focus minutes</label>
          <select id="focus-min">
            <option value="15">15</option>
            <option value="25" selected>25</option>
            <option value="30">30</option>
            <option value="45">45</option>
            <option value="60">60</option>
          </select>
        </div>
        <div class="form-row">
          <label for="break-min">Break minutes</label>
          <select id="break-min">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>

      <div class="task-picker">
        <label for="task-select" class="muted small" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px;">Link to a task (optional)</label>
        <select id="task-select">
          <option value="">— None —</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num" id="stat-today-count">0</div>
          <div class="stat-label">Today</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="stat-today-min">0m</div>
          <div class="stat-label">Today minutes</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="stat-all-count">0</div>
          <div class="stat-label">All time</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="stat-all-hours">0h</div>
          <div class="stat-label">All time hours</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="muted small" style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;">Today's sessions</div>
      <div class="session-list" id="session-list"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="/js/pomodoro.js"></script>
</body>
</html>
