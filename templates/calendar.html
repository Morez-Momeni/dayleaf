<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — Dayleaf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #718F78; --green-dark: #4E6C56; --green-light: #EDF4ED;
      --bg: #F6F7F4; --white: #FFFFFF; --text: #26342C; --muted: #89938A;
      --border: #E9EDE7; --muted-bg: #F2F4F0;
      --amber: #D9A441; --rose: #C9758B;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(38,52,44,.04), 0 4px 14px rgba(38,52,44,.04);
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --green: #8FB197; --green-dark: #A7C7AE; --green-light: #24322A;
      --bg: #171B18; --white: #1F2521; --text: #E7ECE7; --muted: #98A29A;
      --border: #2C332D; --muted-bg: #242A25;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 24px 48px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--green-light); color: var(--green-dark); display: grid; place-items: center; }
    .brand-name { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
    .topbar-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .btn { border: 1px solid transparent; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background .15s ease; white-space: nowrap; text-decoration: none; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-ghost { background: var(--white); border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--muted-bg); }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    .month-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .page-title { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    .page-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .month-label { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--green-light); color: var(--green-dark); margin-top: 6px; }
    .month-nav { display: flex; gap: 4px; flex-wrap: wrap; }

    .calendar-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
    .weekdays div { padding: 12px 8px; text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cell {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      min-height: 120px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      transition: background .12s ease;
    }
    .cell:nth-child(7n) { border-right: 0; }
    .cell:hover { background: var(--muted-bg); }
    .cell.other-month { background: var(--muted-bg); opacity: .55; }
    .cell.today { background: var(--green-light); }
    .cell.selected { box-shadow: inset 0 0 0 2px var(--green); }
    .cell-top { display: flex; justify-content: space-between; align-items: center; }
    .cell-day { font-size: 13px; font-weight: 700; }
    
    /* اصلاح استایل بج تعداد تسک */
    .cell-count {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--green);
      color: #fff;
      line-height: 1.2;
    }

    .cell-task {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--muted-bg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cell-task.done { color: var(--muted); text-decoration: line-through; opacity: .7; }
    .cell-more { font-size: 10px; color: var(--muted); font-weight: 600; }
    .cell-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .priority-dot-low { background: #8FA678; }
    .priority-dot-medium { background: var(--amber); }
    .priority-dot-high { background: var(--rose); }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 100; }
    .modal-backdrop.hidden { display: none; }
    .modal { background: var(--white); color: var(--text); border-radius: var(--radius); width: 100%; max-width: 480px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .modal-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .modal-head .date-label { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .icon-btn { background: transparent; border: 0; color: var(--muted); padding: 4px 8px; border-radius: 8px; display: grid; place-items: center; }
    .icon-btn:hover { background: var(--muted-bg); color: var(--text); }
    .modal-body { padding: 12px 16px 18px; overflow-y: auto; }

    .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--white); margin-bottom: 8px; }
    .task-item.done { opacity: .6; }
    .task-check { width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0; }
    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-item.done .task-title { color: var(--muted); text-decoration: line-through; }
    .task-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .priority-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    .empty { text-align: center; padding: 26px 16px; color: var(--muted); font-size: 14px; }

    .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: calc(100vw - 40px); }
    .toast { background: var(--text); color: var(--white); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.2); animation: slideIn .2s ease; }
    .toast.error { background: #a33; }
    .toast.success { background: var(--green-dark); }
    @keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

    @media (max-width: 720px) {
      .wrap { padding: 16px 12px 32px; }
      .cell { min-height: 90px; padding: 6px; }
      .cell-task { font-size: 10px; padding: 1px 4px; }
      .weekdays div { font-size: 10px; padding: 8px 4px; }
      .page-title { font-size: 22px; }
    }
    @media (max-width: 480px) {
      .cell { min-height: 72px; padding: 4px; }
      .cell-task { display: none; }
      .cell-more { display: block; }
      .toast-container { right: 10px; left: 10px; bottom: 10px; max-width: none; }
      .toast { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a href="/" class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3C8 6 6 9 6 13a6 6 0 0 0 12 0c0-4-2-7-6-10z"/>
            <path d="M12 8v9"/>
          </svg>
        </div>
        <span class="brand-name">Dayleaf</span>
      </a>
      <div class="topbar-actions">
        <a href="/" class="btn btn-ghost">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Planner
        </a>
        <button class="btn btn-ghost theme-toggle" id="theme-toggle" type="button" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="month-header">
      <div>
        <h1 class="page-title">Calendar</h1>
        <p class="page-subtitle">Your whole month at a glance.</p>
        <span class="month-label" id="month-label"></span>
      </div>
      <div class="month-nav">
        <button class="btn btn-ghost" id="prev-month" type="button" title="Previous month">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="btn btn-ghost" id="this-month" type="button">This month</button>
        <button class="btn btn-ghost" id="next-month" type="button" title="Next month">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>

    <div class="calendar-card">
      <div class="weekdays">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div class="grid" id="month-grid"></div>
    </div>

    <!-- DAY MODAL -->
    <div class="modal-backdrop hidden" id="day-modal">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div>
            <h3 id="day-modal-title">Tasks</h3>
            <div class="date-label" id="day-modal-date"></div>
          </div>
          <button class="icon-btn" id="close-day-modal" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body" id="day-modal-body"></div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="/js/calendar.js"></script>
</body>
</html>
